<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(20, 25px);
            gap: 1px;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right,black,grey);
            color: white;
        }

        .cell {
            width: 25px;
            height: 25px;
            border: 1px solid black;
            background-color: rgb(255, 255, 255);
            text-align: center;
        }

        .food {
            background: red;
            border: none;
            border-radius: 12px;
            text-align: center;
        }

        .snake {
            background: rgb(14, 175, 255);
            border-radius: 8px;
            text-align: center;
            border: none;
        }

        .head {
            background-color: rgb(30, 49, 255);
            border-radius: 12px;
            text-align: center;
        }
        h1{
            font-size: 34px;
            margin: 4px;
            text-align: center;
        }
        .scorez{
            border: 1px solid black;
            padding: 7px;
            font-size: 22px;
            margin: 8px;
            background: rgb(46, 45, 45);
            text-align: center;
            padding: 24px;
            border-radius: 12px;
        }
        .score,.highscore{
            margin: 4px;
            text-align: center;
        }
        .Game-Over{
            font-size: 34px;
            margin: 15px;
            text-align: center;

        }
        .restart{
            background: none;
            background: transparent;
            border: none;
            color: white;
            background: linear-gradient(to right , rgb(27, 22, 148) , rgb(34, 34, 210));
            padding:15px 77px;
            font-size: 20px;
            border-radius: 8px;
            margin: 12px;
            text-align: center;
        }
        .left{
            background: linear-gradient(to right , rgb(48, 47, 47) , grey);
            padding: 24px;
            text-align: center;
            margin: 12px;
            border-radius: 24px;
        }
        .container{
            text-align: center;
        }
        .board{
            background: linear-gradient(to right,grey,grey);
            padding: 24px;
            border-radius: 8px;
            text-align: center;
        }
        .status{
            font-size: 22px;
            text-align: center;
        }
        
    </style> 
</head>

<body>
    <div class="container">
        <h1>Snake Game🐍</h1>
<div class="board"></div>

    </div>
    <div class="left">
  <div class="scorez">
    <div class="score">Score: 0</div>
    <div class="highScore">High Score: 0</div>
    </div>
      <div class="restartBtn"><button class="restart">Restart</button></div>
     <div class="footer">
 <div class="status"></div>
    <h2 class="Game-Over"></h2>
    </div>

    </div>

    
    <script>
        const status = document.querySelector(".status")
        const game = document.querySelector(".Game-Over")
        const scoreContainer = document.querySelector(".score")
        const highscoreCont = document.querySelector(".highScore")
        const restartBtn = document.querySelector(".restart")
        let score = 0;
        let speedchanged=false;
        let paused = false;
        let speed = 500;
        let highScore = Number(localStorage.getItem("highscore")) || 0
        highscoreCont.textContent = "High Score: " + highScore;
        let gameLoop;
        const board = document.querySelector(".board")
        for (let i = 0; i < 400; i++) {
            const cell = document.createElement("div");
            cell.classList.add("cell")
            board.appendChild(cell)
        }
        let snake = [42, 41, 40];
        let food = Math.floor(Math.random() * 400)
        generateFood()
        const cells = document.querySelectorAll(".cell")
        function renderSnake() {
            cells.forEach(cell => {
                cell.classList.remove("snake", "food", "head")
            })
            snake.forEach(index => {
                cells[index].classList.add("snake")
            })
            cells[food].classList.add("food")
            cells[snake[0]].classList.add("head")
        }
        renderSnake()
        let direction = 1
        function startGame() {
            gameLoop = setInterval(() => {
                if (paused) {
                    return;
                }
                let newHead = snake[0] + direction
                if (snake[0] % 20 === 0 && direction === -1) {
                    gameOver()
                    return;
                }
                else if (snake[0] % 20 === 19 && direction === 1) {
                    gameOver()
                    return;
                }

                if (snake.slice(1).includes(newHead)) {
                    gameOver()
                    return;
                }
                if (newHead === food) {
                    score++;
                    scoreContainer.textContent = "Score: " + score;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("highscore", highScore)
                        highscoreCont.textContent = "High Score: " + highScore
                    }

                    snake.unshift(newHead)

                    if (snake.length === 400) {
                        game.textContent = "You Win"
                        clearInterval(gameLoop)
                        return;
                    } else {
                       generateFood()
                    }

                    if (score % 5 === 0) {
                        speed = Math.max(100, speed - 50)
                        speedchanged=true;
                    }
                }
                else {
                    snake.unshift(newHead)
                    snake.pop();
                }
                if (snake[0] >= 400 || snake[0] < 0) {
                    gameOver()
                    return;
                }




                renderSnake()
                if(speedchanged)
                {
                    clearInterval(gameLoop)
                        startGame()
                }
            }, speed);
        }
        startGame()
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowUp" && direction !== 20) { direction = -20 }
            if (e.key === "ArrowDown" && direction !== -20) { direction = 20 }
            if (e.key === "ArrowRight" && direction !== -1) { direction = 1 }
            if (e.key === "ArrowLeft" && direction !== 1) { direction = -1 }
            if (
                e.key === "ArrowUp" ||
                e.key === "ArrowDown" ||
                e.key === "ArrowLeft" ||
                e.key === "ArrowRight" ||
                e.code === "Space"
            ) {
                e.preventDefault();
            }
            if (e.code === "Space") {
                paused = !paused;
                status.textContent = paused ? "Paused" : ""
                return;
            }
        })
        function gameOver() {
            game.textContent = "Game Over💀"
            clearInterval(gameLoop);
        }
        restartBtn.addEventListener("click", () => {
            clearInterval(gameLoop)
            direction = 1
            snake = [42, 41, 40]
            score = 0
            game.textContent = ""
            speed = 500;
            status.textContent = ""
            paused = false;
            scoreContainer.textContent = "Score: " + score;
            generateFood()
            renderSnake()
            startGame()
        })
        function generateFood() {
            do {
                food = Math.floor(Math.random() * 400)
            } while (snake.includes(food))
        }
    </script>
</body>

</html>
