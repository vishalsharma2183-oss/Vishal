<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .cell {
            height: 80px;
            width: 80px;
            border: 1px solid rgb(255, 255, 255);
            text-align: center;
            font-size: 55px;
            

        }
        .cell:hover{
    background-color: rgba(255,255,255,0.1);
    cursor:pointer;
}
body{
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: black;
}
 .border{
    display:flex;
    justify-content:center;
}
        .a{
            color: Red;
        }
        .b{
            color: blue;
        }
        .main{
            min-height: 70vh;
            width: 50%;
            background: rgb(0, 0, 24);
            color: white;
            padding: 24px;
        }
        button{
            border: none;
            background: none;
            background: transparent;
            color: white;
          
            background-color: rgb(59, 59, 255);
            padding: 12px 18px;
            font-size: 18px;
            
            border-radius: 22px;
        }
        .buttons{
              display: flex;
            justify-content: center;
            align-items: center;
            gap:20px;
            margin: 12px;
        }
        div{
            font-size: 20px;
        }
        .footer{
            margin:0 10%;
        }
    </style>
</head>

<body>

    <div class="main">
<div class="border">
        <div class="firstrow">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="secondrow">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="thirdrow">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
    </div>
    
    <div class="buttons">
<button class="restart">Restart</button>
<button class="reset" onclick="resetBtn()">Reset Scores</button>
    </div>
     
    <div class="footer">
        
    <h2 class="result"></h2>
    <div class="turn"></div>
    <div class="score">
        <h3>Score Board</h3>
        <div class="x">X Wins: 0</div>
        <div class="o">O Wins: 0</div>
        <div class="d">Draws: 0</div>
    </div>
   
    </div>
    
</div>
    <script>
        const restart = document.querySelector(".restart")
        const result = document.querySelector(".result")
        const turn = document.querySelector(".turn")
        let currentPlayer = "X"
        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];
        let board = Array(9).fill("")
        let xscore = document.querySelector(".x")
        let oscore = document.querySelector(".o")
        let dscore = document.querySelector(".d")
        let scoreBoard = {
            XWins: 0,
            OWins: 0,
            Draw: 0

        }
        let state = false;
        turn.textContent = `${currentPlayer} 's turn`

        const cell = document.querySelectorAll(".cell")
        
        renderGame()
        function renderGame() {

            cell.forEach((c, index) => {
                c.addEventListener("click", () => {
                    if (board[index] !== "" || state) {
                        return;
                    }
                    c.textContent = currentPlayer;
                    
                    board[index] = currentPlayer;
                    if(currentPlayer==="X")
                    {
                        c.classList.add("a")
                    }
                    else{
                        c.classList.add("b")
                    }
                    logic()
                    if (!state) {
                        currentPlayer = currentPlayer === "X" ? "O" : "X"
                        turn.textContent = `${currentPlayer} 's turn`
                    }
                    


                })
            })
        }

        function logic() {
            for (const pattern of winPatterns) {
               const [a,b,c]=pattern;
                if (board[a] === board[b] && board[b] === board[c] && board[a] !== "") {
                    result.textContent = board[a] + " Wins! "
                    cell[a].style.backgroundColor = "green"
                    cell[b].style.backgroundColor = "green"
                    cell[c].style.backgroundColor = "green"
                    state = true;
                    if (board[a] === "X") {
                        scoreBoard.XWins++
                        xscore.textContent = "X Wins: " + scoreBoard.XWins
                    }
                    else {
                        scoreBoard.OWins++;
                        oscore.textContent = "O Wins: " + scoreBoard.OWins
                    }

                    turn.textContent = "Restart the game"
                    return;
                }
            }
            if (!board.includes("") && !state) {
                result.textContent = "Draw"
                scoreBoard.Draw++;
                dscore.textContent = "Draws: " + scoreBoard.Draw;
                turn.textContent = "Restart the game"
                state=true;

            }
        }
        restart.addEventListener("click", () => {
            cell.forEach(c => {
                c.textContent = ""
                c.style.backgroundColor = ""
                c.classList.remove("a" ,"b")
                return;
            })
            result.textContent = ""
            currentPlayer = "X";
            turn.textContent = currentPlayer + " 's turn"
            board = Array(9).fill("")
            state = false;
        })
        function resetBtn() {
            scoreBoard.Draw = 0;
            scoreBoard.XWins = 0;
            scoreBoard.OWins = 0;
            xscore.textContent = "X Wins: " + scoreBoard.XWins
            oscore.textContent = "O Wins: " + scoreBoard.OWins
            dscore.textContent = "Draws: " + scoreBoard.Draw
        }
    </script>
</body>

</html>
