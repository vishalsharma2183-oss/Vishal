<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(-45deg,#4f46e5,#7c3aed,#db2777,#2563eb);
  background-size:400% 400%;
  animation:bgMove 10s ease infinite;
  overflow:hidden;
  padding:20px;
}

@keyframes bgMove{
  0%{
    background-position:0% 50%;
  }
  50%{
    background-position:100% 50%;
  }
  100%{
    background-position:0% 50%;
  }
}

.container{
  width:100%;
  max-width:750px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:30px;
  padding:35px;
  box-shadow:
  0 10px 40px rgba(0,0,0,0.3),
  inset 0 0 10px rgba(255,255,255,0.1);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.questionContainer{
  color:white;
  font-size:38px;
  text-align:center;
  margin-bottom:35px;
  line-height:1.4;
  animation:questionFade 0.5s ease;
}

@keyframes questionFade{
  from{
    opacity:0;
    transform:translateX(30px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.buttons button{
  border:none;
  padding:18px;
  border-radius:18px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(5px);
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.buttons button::before{
  content:"";
  position:absolute;
  width:0;
  height:100%;
  left:0;
  top:0;
  background:rgba(255,255,255,0.15);
  transition:0.4s;
}

.buttons button:hover::before{
  width:100%;
}

.buttons button:hover{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.buttons button:disabled{
  cursor:not-allowed;
  opacity:0.9;
}

.nextBtn{
  display:flex;
  justify-content:center;
  margin-top:35px;
}

.next{
  border:none;
  background:linear-gradient(to right,#06b6d4,#3b82f6);
  color:white;
  font-size:20px;
  font-weight:bold;
  padding:14px 50px;
  border-radius:50px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.next:hover{
  transform:scale(1.08);
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

.score{
  margin-top:25px;
  text-align:center;
  color:white;
  font-size:28px;
  font-weight:bold;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.05);
  }
  100%{
    transform:scale(1);
  }
}

.questioncounter{
  margin-top:18px;
  text-align:center;
  color:#e5e7eb;
  font-size:18px;
  letter-spacing:1px;
}

.finalscore{
  margin-top:30px;
  text-align:center;
  color:white;
  font-size:48px;
  animation:zoomIn 0.8s ease;
}

@keyframes zoomIn{
  from{
    transform:scale(0.5);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.restartBtn{
  display:flex;
  justify-content:center;
  margin-top:25px;
}

.restartBtn button{
  border:none;
  padding:16px 45px;
  border-radius:50px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:linear-gradient(to right,#22c55e,#16a34a);
  transition:0.3s;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.restartBtn button:hover{
  transform:scale(1.08);
}

@media(max-width:700px){

  .questionContainer{
    font-size:28px;
  }

  .buttons{
    grid-template-columns:1fr;
  }

  .buttons button{
    width:100%;
  }
}
</style>
<body>
  <div class="container">

setTimeout(() => {

timeLeft = 30

btn.style.transform = "scale(1)"

btn.style.transform = "scale(1)"
