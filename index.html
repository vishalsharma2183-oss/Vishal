<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Web Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="navbar">
        <div class="svgs">
        <img src="logo.svg" alt="">
        <img src="home.svg" alt="">
        <img class="search" src="search.svg" alt="">
        <img src="browse.svg" alt="">
        </div>
        <div class="btn">
            <span class="textsbtn">
        <div class="premium textbtn">
            <button>Premium</button>
        </div>
        <div class="support textbtn" >
            <button>Support</button>
        </div>
        <div class="download textbtn">
            <button>Download</button>
        </div>
        </span>
        <span class="sectext">
        <div class="install textbtn">
            <button>Install App</button>
        </div>
        <div class="signup textbtn">
            <button>Sign up</button>
        </div>
        </span>
        <div class="login">
            <button>Log in</button>
        </div>
        </div>
    </div>
    <div class="main">
        <div class="left">
            <h3>Your Library</h3>
            <div class="top">
                <h3>Create your first playlist</h3>
                <p>It's easy we will help you</p>
                <div class="createBtn">
                    <button>Create Playlist</button>
                </div>
            </div>
            <div class="bottom">
                <h3>Let's find some podcasts to follow</h3>
                <p>We'll keep you updated on new episodes</p>
                <div class="BrowseBtn">
                    <button>Browse Podcasts</button>
                </div>
            </div>
            <div class="footer">
                <p>Legal Safety&PrivacyCenter PrivacyPolicy Cookies AboutAds Accessibility Cookies </p>
                <div class="EnglishBtn">
                    <button>English</button>
                </div>
            </div>
        </div>
        <div class="right"></div>
    </div>
</body>

</html>
