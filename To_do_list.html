<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    margin-top: 50px;
}

.addBtn {
    padding: 8px 10px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.addBtn:hover {
    background: #218838;
}
.taskList {
    list-style: none;
    padding: 0;
    margin-top: 15px;
}
li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px;
    margin: 5px 0;
    background: #f9f9f9;
    border-radius: 5px;

    /* animation setup */
    opacity: 0;
    transform: translateY(-10px);
    animation: fadeIn 0.3s ease forwards;
}
@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.fade-out {
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.3s ease;
}
     .errorMsg{
            display: none;
            color: red;
            margin: 0;
        }
        .completed{
            text-decoration: line-through;
            color: gray;
            opacity: 0.7;
            transition: all 0.2s ease;
        }
        button {
    margin-left: 5px;
    border: none;
    padding: 4px 6px;
    border-radius: 3px;
    cursor: pointer;
}
button:nth-child(2) {
    background: orange;
    color: white;
}

button:nth-child(3) {
    background: red;
    color: white;
}
        .app {
    background: white;
    padding: 20px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
   
    
}
.taskInput {
    width: 70%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
    </style>
</head>
<body>
    <div class="app">
    <h3>Enter the task</h3><input type="text" name="input" class="taskInput">
    <button class="addBtn">Add</button>
    <p class="errorMsg" >Please enter a task</p>
    <ul class="taskList"></ul>
    </div>
    <script src="To_do_list.js"></script>
</body>
</html>
