<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: all ease 0.3s;
    }

    .image img {
        width: 200px;
    aspect-ratio: 1;
    object-fit: cover;
    }

    .image img:hover {
        transform: translateY(-5px);
        transition: ease 0.3s;

    }

    .loader {
        width: 60px;
        height: 60px;
        border: 6px solid #334155;
        border-top: 6px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }

    .hidden {
        display: none;
    }

    @keyframes spin {
        100% {
            transform: rotate(360deg);
        }
    }

    body {
        background: linear-gradient(60deg, #052c46, #4b54d3);
        color: white;
        display: flex;
        justify-content: center;
        padding: 50px;
        line-height: 1.6;
    }
    .hero{
        min-height: 65vh;
        min-width: 30vw;
        background: #000547;
        padding: 24px;
        border-radius: 16px;
    }
    .hero:hover{
        transform: translateY(-5px);
    }
    input{
        width: 70%;
        padding: 13px 19px;
        font-size: 18px;
        border-radius: 8px;
    }
    button{
        background: none;
        background: transparent;
        cursor: pointer;
        border: none;
        background-color: #0d19bb;
        padding: 6px 34px;
        border-radius: 8px;
        height: 55px;
        width: 27%;
    }
    button:hover{
        transform: translateY(-5px);
    }
    .searchBar{
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 8px;
    }
    .details{
        text-align: left;
        margin: 8px;
        padding: 8px 4px;
    }
    .details h2{
        font-size: 44px;
    }
    .details div{
        font-size: 18px;
    }
    .image img{
        margin: 8px;
    }
    .details a{
        text-decoration: none;
        color: white;
         cursor: pointer;
         background-color: #0d19bb;
        border-radius: 8px;
        width: 100%;
        padding: 14px;
        height: 28px;
        position: relative;
        bottom: -10px;

    }
</style>

<body>
    <div class="hero">
        <div class="searchBar">
            <input placeholder="Type your username" type="text" class="input">
            <button class="searchbox"><img src="search.svg" alt=""></button>
        </div>
        <div class="loader hidden"></div>
        <div class="container">
            <div class="image"></div>
            <div class="details"></div>
        </div>
    </div>

    <script>
        const input = document.querySelector(".input")
        const button = document.querySelector(".searchbox")
        const image = document.querySelector(".image")
        const details = document.querySelector(".details")
        const container = document.querySelector(".container")
        const loader = document.querySelector(".loader")
        button.addEventListener("click", () => {
            if (input.value.trim() === "") {
                alert('Type your username!');
                return;
            }
            getData()
        })
        async function getData() {
            try {
                loader.classList.remove("hidden")
                details.textContent = ""
                image.innerHTML = ""
                const username = input.value.trim();
                const response = await fetch(`https://api.github.com/users/${username}`);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }

                const data = await response.json();
                loader.classList.add("hidden")
                console.log(data);

                renderData(data)
            } catch (error) {
                loader.classList.add("hidden")
                image.innerHTML = ""
                details.innerHTML = `
   <h2>User not found</h2>
   <p>Try another username.</p>
`
                console.error(error.message);
                return;
            }
        }
        function renderData(data) {
            image.innerHTML = ""
            details.innerHTML = ""
            if (data.avatar_url) {
                let img = document.createElement("img")
                img.src = data.avatar_url
                image.appendChild(img)
            } else {
                image.textContent = "NO Avtar found"
            }
            let username = document.createElement("h2");
            username.textContent = data.login
            details.appendChild(username)
            let bio = document.createElement("div")
            bio.textContent = "Bio: " + (data.bio || "No bio Available !")
            details.appendChild(bio)
            let followers = document.createElement("div")
            followers.textContent = "Followers: " + data.followers
            details.appendChild(followers)
            let following = document.createElement("div")
            following.textContent = "Following: " + data.following
            details.appendChild(following)
            let repos = document.createElement("div")
            repos.textContent = "Public Repos: " + data.public_repos;
            details.appendChild(repos)
            let link=document.createElement("a")
            link.href=data.html_url;
            link.target = "_blank"
        link.textContent="Visit Profile"
        details.appendChild(link)
            input.value = ""
        }
        input.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                button.click()
            }
        }
        )

    </script>
</body>

</html>
