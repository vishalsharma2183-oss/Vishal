<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .weatherCard {
            width: 350px;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .temp {
            font-size: 48px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .weatherInfo {
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .details div {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
        }

        .con {
            margin: 4px;
            font-size: 19px;
        }

        .weatherCard {
            transition: 0.3s;
            color: white;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }

        button:hover {
            background: #2563eb;
        }

        .weatherCard:hover {
            transform: translateY(-5px);
        }

        .searchBox {
            display: flex;
            gap: 10px;
        }

        .city {
            font-size: 28px;
        }
    </style>
</head>

<body>
    <div class="weatherCard">
        <div class="searchBox">
            <input type="text" class="search" placeholder="Search for a city">
            <button class="btn">Search</button>
        </div>
        <div class="weatherInfo">
            <div class="city detail-card"></div>
            <div class="temp detail-card"></div>
            <div class="con detail-card"></div>
        </div>
        <div class="details">
            <div class="humidity  "></div>
            <div class="pressure "></div>
            <div class="wind "></div>
        </div>


    </div>
    <script>
        const weatherCard=document.querySelector(".weatherCard")
        const search = document.querySelector(".search")
        const city = document.querySelector(".city")
        const temperature = document.querySelector(".temp")
        const clouds = document.querySelector(".con")
        const btn = document.querySelector(".btn")
        const wind = document.querySelector(".wind")
        const humidity = document.querySelector(".humidity")
        const pressure = document.querySelector(".pressure")
        btn.addEventListener("click", getWeather)
        async function getWeather() {
            if (search.value.trim() === "") {
                alert('Enter a city to get Weather');
                return;
            }
            city.textContent = "Loading....."
            let cityname = search.value.trim()
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityname}&appid=179f9b62d6e712a1e1f30404d42779b0&units=metric`)
                if (!response.ok) {
                    throw new Error(`HTP Error Status:${response.status}`)
                }
                const data = await response.json()
                console.log(data);
                console.log(data);

                renderWeather(data)

            } catch (error) {
                
                city.textContent = "Error: City not found"
                 temperature.textContent = ""
            clouds.textContent = ""
            wind.textContent = ""
            humidity.textContent = ""
            pressure.textContent = ""
                
                console.log('There was an error', error);
            }
            search.value = ""
        }
        function renderWeather(data) {
            city.textContent = "City:" + data.name;
            temperature.textContent = data.main.temp + "°C";
            clouds.textContent = "Weather:" + data.weather[0].main
            wind.textContent = "Wind Speed:" + data.wind.speed + " m/s";
            humidity.textContent = "Humidity:" + data.main.humidity + "%";
            pressure.textContent = "Pressure:" + data.main.pressure + " hPa";
        }
        search.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                getWeather()
            }
        })
    </script>
</body>

</html>
